<style>
:root{
  --p-900:#4a1038; --p-700:#7a1f5c; --p-600:#93276f; --p-500:#ab2f81;
  --p-100:#f9e8f2; --p-50:#fdf5fa;

  --danger:#d9534f; --warn:#e0a020;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
html{-webkit-text-size-adjust:100%;}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--p-50);color:var(--ink);min-height:100vh;padding-bottom:calc(70px + env(safe-area-inset-bottom));}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;display:block;}
input,select,textarea{font-size:16px;}

.topbar{background:linear-gradient(90deg,var(--p-900),var(--p-700));color:#fff;padding:10px 14px;}
.ticker-wrap{direction:ltr;overflow:hidden;white-space:nowrap;position:relative;background:rgba(255,255,255,.1);border-radius:20px;padding:6px 0;}
.ticker-track{display:inline-block;padding-right:100%;animation:ticker 22s linear infinite;font-size:14px;font-weight:600;}
.ticker-track span{margin-inline-end:60px;}
@keyframes ticker{0%{transform:translateX(0);}100%{transform:translateX(-100%);}}

.brandbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;max-width:960px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;color:var(--p-900);}
.brand i{color:var(--p-600);}
.admin-link{font-size:13px;color:var(--p-700);border:1px solid var(--line);padding:6px 12px;border-radius:20px;background:#fff;display:flex;gap:6px;align-items:center;}

.container{max-width:960px;margin:0 auto;padding:14px 14px 30px;}

.search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);margin-bottom:12px;}
.search-box input{border:none;outline:none;flex:1;font-family:inherit;font-size:16px;background:transparent;color:var(--ink);}
.search-box i{color:var(--p-600);}

.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
@media(max-width:520px){.filters{grid-template-columns:1fr 1fr;} .filters .village-input{grid-column:1/-1;}}
.filters select,.filters input{padding:9px 6px;border-radius:12px;border:1px solid var(--line);background:#fff;font-family:inherit;font-size:16px;color:var(--ink);min-width:0;}

.cta-btn{display:block;background:linear-gradient(90deg,var(--p-700),var(--p-500));color:#fff;border-radius:var(--radius);padding:20px;text-align:center;box-shadow:var(--shadow);margin-bottom:22px;font-weight:800;font-size:16px;}
.cta-btn i{font-size:26px;display:block;margin-bottom:6px;}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;}
.section-title h2{font-size:17px;margin:0;color:var(--p-900);}
.section-title .count{font-size:12px;color:var(--ink-soft);}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.card{background:#fff;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;animation:fadeIn .35s ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.card .thumb{width:100%;aspect-ratio:3/4;background:var(--p-100) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--p-500);font-size:26px;position:relative;}
.badge{position:absolute;top:6px;right:6px;background:var(--p-700);color:#fff;font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600;}
.badge.closed{background:#9a9a9a;}
.card .body{padding:10px;flex:1;display:flex;flex-direction:column;gap:4px;}
.card h3{font-size:14px;margin:0;line-height:1.4;}

.form-card{background:#fff;border-radius:var(--radius);padding:18px;border:1px solid var(--line);box-shadow:var(--shadow);}

.field{margin-bottom:14px;}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.btn:hover{background:var(--p-700);}
.btn.outline{background:#fff;color:var(--p-700);border:1px solid var(--p-600);}
.btn.danger{background:var(--danger);}
.btn.warn{background:var(--warn);}
.btn.small{width:auto;padding:8px 14px;font-size:12px;}
.btn:disabled{opacity:.6;}

.gallery{border-radius:var(--radius);overflow:hidden;background:var(--p-100);margin-bottom:10px;box-shadow:var(--shadow);}
.gallery .main-img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--p-100);}
.gallery .thumbs{display:flex;gap:6px;padding:8px;overflow-x:auto;background:#fff;}
.gallery .thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:2px solid transparent;flex-shrink:0;}
.gallery .thumbs img.active{border-color:var(--p-600);}
.detail-title{font-size:19px;font-weight:800;color:var(--p-900);margin:6px 0;}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.chip{background:var(--p-100);color:var(--p-700);font-size:12px;padding:5px 12px;border-radius:20px;font-weight:600;}
.chip.status-closed{background:#eee;color:#777;}
.chip.status-pending{background:#fff4e0;color:#a06a00;}
.chip.status-rejected{background:#fde3e3;color:#a02020;}
.detail-desc{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;line-height:2;font-size:14px;box-shadow:var(--shadow);margin-bottom:14px;}
.detail-facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.fact{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.fact span{display:block;font-size:11px;color:var(--ink-soft);}
.fact b{font-size:14px;}

.bottom-nav{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--line);display:flex;box-shadow:0 -4px 16px rgba(0,0,0,.06);z-index:50;padding-bottom:env(safe-area-inset-bottom);}
.bottom-nav a{flex:1;text-align:center;padding:9px 0 7px;font-size:11px;color:var(--ink-soft);}
.bottom-nav a i{display:block;font-size:18px;margin-bottom:3px;}
.bottom-nav a.active{color:var(--p-600);}

.toast{position:fixed;bottom:80px;right:50%;transform:translateX(50%);background:var(--p-900);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:200;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;max-width:92vw;width:max-content;text-align:center;line-height:1.6;}
.toast.show{opacity:1;bottom:90px;}

.conn-status{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:4px 10px;border-radius:20px;background:#fff;border:1px solid var(--line);}
.dot{width:8px;height:8px;border-radius:50%;background:#ccc;}
.dot.online{background:var(--p-600);}
.dot.offline{background:var(--danger);}
.dot.syncing{background:var(--warn);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

.admin-login{max-width:360px;margin:40px auto;}
.admin-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px;}
.admin-tabs button{white-space:nowrap;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink-soft);}
.admin-tabs button.active{background:var(--p-700);color:#fff;border-color:var(--p-700);}
.admin-row{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;gap:8px;}
.admin-row .info{flex:1;min-width:0;}
.admin-row .info b{display:block;font-size:13px;}
.admin-row .info span{font-size:11px;color:var(--ink-soft);}
.admin-row .acts{display:flex;gap:6px;flex-shrink:0;}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
.icon-btn.edit:hover{color:var(--p-700);border-color:var(--p-700);}
.icon-btn.del:hover{color:var(--danger);border-color:var(--danger);}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.tag-pill{background:var(--p-100);color:var(--p-700);font-size:12px;padding:6px 10px;border-radius:20px;display:flex;align-items:center;gap:6px;}
.tag-pill i{cursor:pointer;color:var(--danger);}
.province-block{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fff;}
.province-block h4{margin:0 0 6px;font-size:14px;color:var(--p-900);}
.city-tags{display:flex;flex-wrap:wrap;gap:6px;}
.settings-block{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
.settings-block h4{margin:0 0 10px;font-size:14px;color:var(--p-900);}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);}
.toggle-row:last-child{border-bottom:none;}
.switch{position:relative;width:44px;height:24px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch .slider{position:absolute;inset:0;background:#ccc;border-radius:24px;transition:.2s;cursor:pointer;}
.switch .slider:before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
.switch input:checked + .slider{background:var(--p-600);}
.switch input:checked + .slider:before{transform:translateX(-20px);}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--p-700);font-size:13px;margin-bottom:10px;font-weight:600;}
</style>

<script>
/* =========================================================
   روا — فرانت‌اند تک‌فایل
   بک‌اند: Cloudflare Worker + KV
   ========================================================= */

const CFG_KEY='rental_config_v1', CACHE_KEY='rental_cache_v1', SESSION_KEY='rental_admin_session_v1', OWNER_KEY='rental_owner_v1';
const DEFAULT_WORKER_URL='https://old-cell-3216.shoes14001410.workers.dev'; // آدرس Worker شما — اگر بعداً عوض شد همین‌جا اصلاحش کنید

function loadConfig(){
  let cfg={}; try{ cfg=JSON.parse(localStorage.getItem(CFG_KEY))||{}; }catch(e){ cfg={}; }
  if(!cfg.workerUrl && DEFAULT_WORKER_URL) cfg.workerUrl=DEFAULT_WORKER_URL;
  return cfg;
}
function saveConfig(cfg){ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }
let CONFIG=loadConfig();

function loadSession(){ try{ return JSON.parse(sessionStorage.getItem(SESSION_KEY))||null; }catch(e){ return null; } }
function saveSession(s){ sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
function clearSession(){ sessionStorage.removeItem(SESSION_KEY); }
let SESSION=loadSession();
function isAdminLoggedIn(){ return !!(SESSION && SESSION.token && SESSION.expiresAt>Date.now()); }

function loadOwner(){ try{ return JSON.parse(localStorage.getItem(OWNER_KEY))||null; }catch(e){ return null; } }
function saveOwner(o){ localStorage.setItem(OWNER_KEY, JSON.stringify(o)); }
let MY_OWNER = loadOwner(); // {name, phone}

function defaultDB(){
  return {
    meta:{version:1,lastUpdated:Date.now()},
    settings:{
      siteName:'روا | اجاره و فروش لباس مجلسی', adminPasswordHash:null,
      contact:{phone:'',telegram:'',whatsapp:'',email:'',note:''},
      licensePolicy:{requireForPosting:false, requireForExtraImages:false, freeImageLimit:5},
      mediaGuide:{text:'',url:''},
      modeling:{enabled:true, price:200000, note:'عکاسی مدلینگ لباس شما توسط تیم ما — هزینه جداگانه دارد.'}
    },
    ticker:{text:'👗 روا | برای ثبت آگهی رایگان اجاره یا فروش لباس مجلسی، از دکمهٔ زیر استفاده کنید — آگهی شما پس از بررسی مدیر منتشر می‌شود'},
    categories:{rentalTypes:['لباس مجلسی','لباس عروس','لباس نامزدی','لباس کودک','سایر']},
    locations:{provinces:[{name:'مرکزی',cities:['اراک','ساوه','خمین','محلات','دلیجان','تفرش','شازند']}]},
    owners:[], listings:[], adRequests:[], stats:{totalViews:0,dailyViews:{}}
  };
}
let DB=defaultDB();

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(ts){ try{ return new Date(ts).toLocaleDateString('fa-IR'); }catch(e){ return ''; } }
function fmtPrice(n){ if(n==null||n==='') return ''; return Number(n).toLocaleString('fa-IR'); }
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  const duration=Math.min(6000,Math.max(2600,msg.length*70));
  window.__toastTimer=setTimeout(()=>t.classList.remove('show'),duration);
}
function isYoutube(url){ return /youtube\.com|youtu\.be/.test(url||''); }
function toYoutubeEmbed(url){ const m=url.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{6,})/); return m? `https://www.youtube.com/embed/${m[1]}` : url; }
function isAparat(url){ return /aparat\.com/.test(url||''); }
function toAparatEmbed(url){ const m=url.match(/aparat\.com\/v\/(\w+)/); return m? `https://www.aparat.com/video/video/embed/videohash/${m[1]}/vt/frame` : url; }

function saveLocalCache(){ localStorage.setItem(CACHE_KEY, JSON.stringify(DB)); }
function loadLocalCache(){ try{ const raw=localStorage.getItem(CACHE_KEY); if(raw) DB=Object.assign(defaultDB(), JSON.parse(raw)); }catch(e){} }

function apiReady(){ return !!CONFIG.workerUrl; }
function setConn(state){
  const dot=document.getElementById('connDot'), txt=document.getElementById('connText');
  if(!dot) return;
  dot.className='dot '+(state==='online'?'online':state==='syncing'?'syncing':'offline');
  txt.textContent = state==='online'?'متصل':state==='syncing'?'در حال همگام‌سازی':(apiReady()?'قطع اتصال':'بدون پیکربندی');
}
function apiUrl(p){ return CONFIG.workerUrl.replace(/\/$/,'')+p; }
function adminHeaders(){ return SESSION? {'X-Admin-Token':SESSION.token,'X-Admin-Expiry':String(SESSION.expiresAt)} : {}; }
async function apiFetch(path, opts={}){
  const res=await fetch(apiUrl(path), {
    method: opts.method||'GET',
    headers: Object.assign({'Content-Type':'application/json'}, opts.admin? adminHeaders():{}, opts.headers||{}),
    body: opts.body? JSON.stringify(opts.body) : undefined
  });
  let data=null; try{ data=await res.json(); }catch(e){}
  if(!res.ok){ const err=new Error((data&&(data.message||data.error))||('HTTP '+res.status)); err.status=res.status; err.data=data; throw err; }
  return data;
}
async function refreshData(showToast){
  if(!apiReady()){ setConn('offline'); loadLocalCache(); return false; }
  setConn('syncing');
  try{
    const data=await apiFetch('/api/data');
    DB=Object.assign(defaultDB(), data);
    saveLocalCache(); setConn('online');
    if(showToast) toast('اطلاعات به‌روز شد');
    return true;
  }catch(e){
    setConn('offline'); loadLocalCache();
    if(showToast) toast('اتصال به سرور برقرار نشد');
    return false;
  }
}

function go(hash){ location.hash=hash; }
window.addEventListener('hashchange', renderRoute);
function parseHash(){ return (location.hash||'#/').slice(1).split('/').filter(Boolean); }
function setActiveNav(name){ ['home','list','add','contact','admin'].forEach(n=>{ document.getElementById('nav-'+n).classList.toggle('active', n===name); }); }
function renderRoute(){
  const parts=parseHash();
  window.scrollTo(0,0);
  if(parts.length===0){ setActiveNav('home'); return renderHome(); }
  if(parts[0]==='list'){ setActiveNav('list'); return renderList(); }
  if(parts[0]==='item'){ setActiveNav(''); return renderDetail(parts[1]); }
  if(parts[0]==='add'){ setActiveNav('add'); return renderForm(); }
  if(parts[0]==='edit'){ setActiveNav(''); return renderForm(parts[1]); }
  if(parts[0]==='contact'){ setActiveNav('contact'); return renderContact(); }
  if(parts[0]==='admin'){ setActiveNav('admin'); return renderAdmin(parts[1]||'dashboard'); }
  setActiveNav('home'); renderHome();
}
function renderTicker(){
  const el=document.getElementById('tickerTrack');
  const text=DB.ticker && DB.ticker.text? DB.ticker.text : '';
  el.innerHTML=`<span>${esc(text)}</span><span>${esc(text)}</span>`;
}

let FILTER_STATE={q:'',province:'',city:'',village:'',category:'',listingType:''};
function provinceOptions(sel){ return `<option value="">همه استان‌ها</option>`+DB.locations.provinces.map(p=>`<option value="${esc(p.name)}" ${sel===p.name?'selected':''}>${esc(p.name)}</option>`).join(''); }
function cityOptions(provinceName, sel){ const p=DB.locations.provinces.find(x=>x.name===provinceName); const cities=p?p.cities:[]; return `<option value="">همه شهرستان‌ها</option>`+cities.map(c=>`<option value="${esc(c)}" ${sel===c?'selected':''}>${esc(c)}</option>`).join(''); }
function categoryOptions(sel){ return `<option value="">همه انواع</option>`+DB.categories.rentalTypes.map(c=>`<option value="${esc(c)}" ${sel===c?'selected':''}>${esc(c)}</option>`).join(''); }
function listingTypeOptions(sel){
  return `<option value="">اجاره و فروش</option><option value="rent" ${sel==='rent'?'selected':''}>فقط اجاره</option><option value="sale" ${sel==='sale'?'selected':''}>فقط فروش</option>`;
}

function renderHome(){
  const app=document.getElementById('app');
  app.innerHTML=`
    <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i>
      <input id="searchInput" placeholder="جستجوی لباس..." value="${esc(FILTER_STATE.q)}"></div>
    <div class="filters">
      <select id="fType">${listingTypeOptions(FILTER_STATE.listingType)}</select>
      <select id="fCategory">${categoryOptions(FILTER_STATE.category)}</select>
      <select id="fProvince">${provinceOptions(FILTER_STATE.province)}</select>
      <select id="fCity">${cityOptions(FILTER_STATE.province, FILTER_STATE.city)}</select>
    </div>
    <a class="cta-btn" href="#/add"><i class="fa-solid fa-plus"></i>ثبت رایگان آگهی اجاره یا فروش لباس</a>
    <div class="section-title"><h2>جدیدترین آگهی‌ها</h2><span class="count">${DB.listings.filter(x=>x.status==='active').length} مورد</span></div>
    <div class="grid" id="recentGrid"></div>
  `;
  document.getElementById('searchInput').addEventListener('input', e=>{ FILTER_STATE.q=e.target.value; renderRecent(); });
  document.getElementById('fType').addEventListener('change', e=>{ FILTER_STATE.listingType=e.target.value; renderRecent(); });
  document.getElementById('fCategory').addEventListener('change', e=>{ FILTER_STATE.category=e.target.value; renderRecent(); });
  document.getElementById('fProvince').addEventListener('change', e=>{
    FILTER_STATE.province=e.target.value; FILTER_STATE.city='';
    document.getElementById('fCity').innerHTML=cityOptions(FILTER_STATE.province,'');
    renderRecent();
  });
  document.getElementById('fCity').addEventListener('change', e=>{ FILTER_STATE.city=e.target.value; renderRecent(); });
  renderRecent();
}
function matchesFilter(item){
  if(item.status!=='active') return false;
  const q=FILTER_STATE.q.trim();
  if(q && !((item.title||'').includes(q) || (item.description||'').includes(q))) return false;
  if(FILTER_STATE.listingType && (item.listingType||'rent')!==FILTER_STATE.listingType) return false;
  if(FILTER_STATE.category && item.category!==FILTER_STATE.category) return false;
  if(FILTER_STATE.province && item.province!==FILTER_STATE.province) return false;
  if(FILTER_STATE.city && item.city!==FILTER_STATE.city) return false;
  if(FILTER_STATE.village && !(item.village||'').includes(FILTER_STATE.village)) return false;
  return true;
}
function renderRecent(){
  const grid=document.getElementById('recentGrid'); if(!grid) return;
  const items=DB.listings.filter(matchesFilter).sort((a,b)=>(b.featured?1:0)-(a.featured?1:0) || b.createdAt-a.createdAt).slice(0,20);
  grid.innerHTML=items.length? items.map(cardHtml).join('') : `<div class="empty-state" style="grid-column:1/-1"><i class="fa-solid fa-shirt"></i>موردی یافت نشد</div>`;
}
function cardHtml(item){
  const img=item.images && item.images[0];
  const hasDiscount = item.originalPrice!=null && item.price!=null && item.originalPrice>item.price;
  const priceLabel = item.price!=null? (fmtPrice(item.price)+' تومان') : 'تماس بگیرید';
  const loc=[item.city,item.province].filter(Boolean).join('، ');
  const typeLabel = item.listingType==='sale'? 'فروش' : 'اجاره';
  return `
  <a class="card" href="#/item/${item.id}">
    <div class="thumb" style="${img?`background-image:url('${esc(img)}')`:''}">
      ${img?'':'<i class="fa-solid fa-shirt"></i>'}
      <span class="badge">${typeLabel} · ${esc(item.category||'لباس')}</span>
      ${item.featured? `<span class="badge" style="top:auto;bottom:6px;background:#c9971f;">⭐ ویژه</span>` : ''}
      ${hasDiscount? `<span class="badge" style="top:auto;bottom:6px;${item.featured?'left:6px;right:auto;':''}background:var(--danger);">تخفیف</span>` : ''}
    </div>
    <div class="body">
      <h3>${esc(item.title)}</h3>
      <div class="meta"><i class="fa-solid fa-location-dot"></i>${esc(loc||'—')}</div>
      <div class="price">${hasDiscount? `<span style="text-decoration:line-through;color:var(--ink-soft);font-weight:400;font-size:11px;">${fmtPrice(item.originalPrice)}</span> ${priceLabel}` : priceLabel}</div>
    </div>
  </a>`;
}

function renderList(){
  const app=document.getElementById('app');
  app.innerHTML=`
    <a class="back-link" href="#/"><i class="fa-solid fa-arrow-right"></i> بازگشت</a>
    <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i>
      <input id="searchInput2" placeholder="جستجو..." value="${esc(FILTER_STATE.q)}"></div>
    <div class="filters">
      <select id="fType2">${listingTypeOptions(FILTER_STATE.listingType)}</select>
      <select id="fCategory2">${categoryOptions(FILTER_STATE.category)}</select>
      <select id="fProvince2">${provinceOptions(FILTER_STATE.province)}</select>
      <select id="fCity2">${cityOptions(FILTER_STATE.province, FILTER_STATE.city)}</select>
    </div>
    <div class="section-title"><h2>همهٔ آگهی‌ها</h2>
      <a class="btn small" href="#/add"><i class="fa-solid fa-plus"></i> ثبت آگهی</a></div>
    <div class="grid" id="listGrid"></div>
  `;
  document.getElementById('searchInput2').addEventListener('input', e=>{ FILTER_STATE.q=e.target.value; renderListGrid(); });
  document.getElementById('fType2').addEventListener('change', e=>{ FILTER_STATE.listingType=e.target.value; renderListGrid(); });
  document.getElementById('fCategory2').addEventListener('change', e=>{ FILTER_STATE.category=e.target.value; renderListGrid(); });
  document.getElementById('fProvince2').addEventListener('change', e=>{
    FILTER_STATE.province=e.target.value; FILTER_STATE.city='';
    document.getElementById('fCity2').innerHTML=cityOptions(FILTER_STATE.province,'');
    renderListGrid();
  });
  document.getElementById('fCity2').addEventListener('change', e=>{ FILTER_STATE.city=e.target.value; renderListGrid(); });
  renderListGrid();
}
function renderListGrid(){
  const grid=document.getElementById('listGrid');
  const arr=DB.listings.filter(matchesFilter).sort((a,b)=>(b.featured?1:0)-(a.featured?1:0) || b.createdAt-a.createdAt);
  grid.innerHTML=arr.length? arr.map(cardHtml).join('') : `<div class="empty-state" style="grid-column:1/-1"><i class="fa-solid fa-shirt"></i>آگهی‌ای ثبت نشده است</div>`;
}

function findItem(id){ return DB.listings.find(x=>x.id===id); }
function renderDetail(id){
  const app=document.getElementById('app');
  const item=findItem(id);
  if(!item){ app.innerHTML=`<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i>آگهی یافت نشد</div>`; return; }
  const images = item.images && item.images.length? item.images : [];

  let galleryHtml='';
  if(images.length){
    galleryHtml = `<div class="gallery">
      <img class="main-img" id="mainImg" src="${esc(images[0])}" onerror="this.src='';this.style.background='var(--p-100)'">
      ${images.length>1? `<div class="thumbs">${images.map((im,i)=>`<img src="${esc(im)}" class="${i===0?'active':''}" data-thumb="${i}">`).join('')}</div>` : ''}
    </div>`;
  } else {
    galleryHtml = `<div class="gallery"><div style="aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;color:#b98aa8;font-size:34px;"><i class="fa-solid fa-shirt"></i></div></div>`;
  }
  let videoHtml='';
  if(item.videoUrl){
    if(isYoutube(item.videoUrl)) videoHtml=`<div class="gallery"><iframe style="width:100%;aspect-ratio:16/9;border:none;" src="${esc(toYoutubeEmbed(item.videoUrl))}" allowfullscreen></iframe></div>`;
    else if(isAparat(item.videoUrl)) videoHtml=`<div class="gallery"><iframe style="width:100%;aspect-ratio:16/9;border:none;" src="${esc(toAparatEmbed(item.videoUrl))}" allowfullscreen></iframe></div>`;
    else videoHtml=`<div class="gallery"><video style="width:100%;aspect-ratio:16/9;" src="${esc(item.videoUrl)}" controls></video></div>`;
  }

  const statusMap = { active:['فعال','status-active'], closed:['غیرفعال / رزرو شده','status-closed'], pending:['در انتظار تأیید مدیر','status-pending'], rejected:['رد شده','status-rejected'] };
  const st = statusMap[item.status] || ['—',''];

  const facts=[
    ['استان', item.province||'—'], ['شهرستان', item.city||'—'],
    ['نوع', item.category||'—'], ['سایز', item.size||'—'],
  ];

  app.innerHTML=`
    <a class="back-link" href="#/list"><i class="fa-solid fa-arrow-right"></i> بازگشت</a>
    ${galleryHtml}
    ${videoHtml}
    <div class="chips">
      <span class="chip ${st[1]}">${st[0]}</span>
      <span class="chip">${item.listingType==='sale'?'فروش':'اجاره'}</span>
      ${item.category? `<span class="chip">${esc(item.category)}</span>`:''}
    </div>
    ${item.status==='pending'? `<div class="hint-box"><i class="fa-solid fa-clock"></i> این آگهی هنوز تأیید نشده و فقط برای شما قابل مشاهده است. پس از بررسی مدیر (حداکثر تا ۲ ساعت) منتشر می‌شود.</div>`:''}
    ${item.status==='rejected'? `<div class="hint-box" style="background:#fde3e3;color:#a02020;"><i class="fa-solid fa-circle-exclamation"></i> این آگهی رد شده. ${item.rejectionReason? 'دلیل: '+esc(item.rejectionReason) : ''}</div>`:''}
    <div class="detail-title">${esc(item.title)}</div>
    <div class="detail-title" style="font-size:18px;color:var(--p-700);display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      ${item.originalPrice!=null && item.price!=null && item.originalPrice>item.price? `<span style="text-decoration:line-through;color:var(--ink-soft);font-weight:400;font-size:14px;">${fmtPrice(item.originalPrice)} تومان</span>` : ''}
      <span>${item.price!=null? fmtPrice(item.price)+' تومان' : 'برای قیمت تماس بگیرید'}</span>
    </div>
    <div class="detail-facts">${facts.map(f=>`<div class="fact"><span>${esc(f[0])}</span><b>${esc(f[1])}</b></div>`).join('')}</div>
    <div class="detail-desc">${esc(item.description||'توضیحی ثبت نشده است.').replace(/\n/g,'<br>')}</div>
    <div class="form-card">
      <h2><i class="fa-solid fa-phone"></i> تماس با صاحب آگهی</h2>
      <a class="btn" href="tel:${esc(item.ownerPhone||'')}"><i class="fa-solid fa-phone"></i> ${esc(item.ownerPhone||'ثبت نشده')}</a>
    </div>
  `;
  document.querySelectorAll('[data-thumb]').forEach(t=>{
    t.addEventListener('click', ()=>{
      document.getElementById('mainImg').src = images[+t.dataset.thumb];
      document.querySelectorAll('[data-thumb]').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
    });
  });
  if(apiReady() && item.status==='active'){
    apiFetch(`/api/listings/${id}/view`, { method:'POST' }).catch(()=>{});
  }
}

function renderForm(editId){
  const app=document.getElementById('app');
  const editing=!!editId;
  const existing = editing? findItem(editId) : null;
  if(editing && !existing){ app.innerHTML=`<div class="empty-state">آگهی یافت نشد</div>`; return; }

  const policy = DB.settings.licensePolicy;
  const mg = DB.settings.mediaGuide || {text:'',url:''};
  const modeling = DB.settings.modeling || {enabled:false,price:0,note:''};
  const images = existing? (existing.images||[]) : [''];

  app.innerHTML=`
    <a class="back-link" href="#/list"><i class="fa-solid fa-arrow-right"></i> بازگشت</a>
    <div class="form-card">
      <h2><i class="fa-solid fa-shirt"></i> ${editing?'ویرایش':'ثبت'} آگهی اجاره لباس</h2>
      ${!apiReady() ? `<div class="hint-box">سرور هنوز پیکربندی نشده — آدرس Worker را از پنل مدیریت ← تنظیمات وارد کنید.</div>` : ''}

      <div class="row2">
        <div class="field"><label>نام شما</label><input id="ownerName" value="${esc((MY_OWNER&&MY_OWNER.name)||(existing&&existing.ownerName)||'')}" placeholder="نام و نام خانوادگی"></div>
        <div class="field"><label>شماره تماس</label><input id="ownerPhone" value="${esc((MY_OWNER&&MY_OWNER.phone)||(existing&&existing.ownerPhone)||'')}" placeholder="09xxxxxxxxx" inputmode="tel"></div>
      </div>

      <div class="field">
        <label>نوع آگهی</label>
        <div class="price-mode" style="display:flex;gap:10px;">
          <label style="flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:13px;background:var(--p-50);cursor:pointer;"><input type="radio" name="fListingType" value="rent" ${!existing||existing.listingType!=='sale'?'checked':''} style="width:auto;"> اجاره</label>
          <label style="flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:13px;background:var(--p-50);cursor:pointer;"><input type="radio" name="fListingType" value="sale" ${existing&&existing.listingType==='sale'?'checked':''} style="width:auto;"> فروش</label>
        </div>
      </div>
      <div class="field"><label>عنوان آگهی</label><input id="fTitle" value="${existing?esc(existing.title):''}" placeholder="مثلاً لباس مجلسی سرمه‌ای سایز ۳۸"></div>
      <div class="field"><label>نوع لباس</label>
        <select id="fCat"><option value="">انتخاب کنید</option>${DB.categories.rentalTypes.map(t=>`<option value="${esc(t)}" ${existing&&existing.category===t?'selected':''}>${esc(t)}</option>`).join('')}</select>
      </div>
      <div class="row2">
        <div class="field"><label>استان</label><select id="fProvinceF"><option value="">انتخاب کنید</option>${provinceOptions(existing?existing.province:'مرکزی')}</select></div>
        <div class="field"><label>شهرستان</label><select id="fCityF">${cityOptions(existing?existing.province:'مرکزی', existing?existing.city:'اراک')}</select></div>
      </div>
      <div class="row2">
        <div class="field"><label>سایز</label><input id="fSize" value="${existing?esc(existing.size):''}" placeholder="مثلاً 38"></div>
        <div class="field"><label id="priceLabel">قیمت (تومان)</label><input id="fPrice" type="number" value="${existing?esc(existing.price||''):''}" placeholder="مبلغ"></div>
        <div class="field">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="fHasDiscount" ${existing&&existing.originalPrice?'checked':''} style="width:auto;"> این آگهی تخفیف داره
          </label>
          <div id="discountRow" style="display:${existing&&existing.originalPrice?'block':'none'};margin-top:8px;">
            <label>قیمت قبل از تخفیف (تومان)</label>
            <input id="fOriginalPrice" type="number" value="${existing?esc(existing.originalPrice||''):''}" placeholder="مبلغ قبل از تخفیف">
          </div>
        </div>
      </div>
      <div class="field"><label>توضیحات</label><textarea id="fDesc" placeholder="رنگ، جنس پارچه، شرایط اجاره...">${existing?esc(existing.description):''}</textarea></div>

      <div class="field">
        <label>عکس‌ها (لینک) — ${policy.freeImageLimit} تای اول رایگان${policy.requireForExtraImages?'، بیشتر از اون نیاز به لایسنس داره':''}</label>
        ${mg.url? `<div class="hint-box"><i class="fa-solid fa-circle-info"></i> ${mg.text? esc(mg.text)+' ' : 'برای گرفتن لینک عکس می‌توانید از این سایت استفاده کنید: '}<a href="${esc(mg.url)}" target="_blank" style="color:var(--p-700);font-weight:700;">${esc(mg.url)}</a></div>` : ''}
        <div id="imgRows"></div>
        <button class="btn small outline" id="addImgRow" type="button"><i class="fa-solid fa-plus"></i> افزودن عکس دیگر</button>
      </div>
      <div class="field"><label>لینک فیلم (اختیاری)</label><input id="fVid" value="${existing?esc(existing.videoUrl):''}" placeholder="لینک یوتیوب / آپارات / فایل mp4"></div>

      ${modeling.enabled? `
      <div class="field" style="background:var(--p-50);border:1px solid var(--line);border-radius:12px;padding:12px;">
        <label style="display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;">
          <input type="checkbox" id="fWantsModeling" ${existing&&existing.wantsModeling?'checked':''} style="width:auto;">
          می‌خوام لباسم روی مدل عکاسی بشه (مدلینگ)
        </label>
        <div id="modelingNote" style="display:${existing&&existing.wantsModeling?'block':'none'};margin-top:8px;font-size:12px;color:var(--ink-soft);line-height:1.9;">
          ${esc(modeling.note||'')} این گزینه پولی است — هزینه: <b style="color:var(--p-700);">${fmtPrice(modeling.price)} تومان</b>. پس از ثبت آگهی، برای هماهنگی پرداخت با پشتیبانی در تماس باشید.
        </div>
      </div>` : ''}

      <button class="btn" id="submitForm"><i class="fa-solid fa-check"></i> ثبت آگهی</button>
    </div>
  `;

  const imgRows=document.getElementById('imgRows');
  function renderImgRows(){
    imgRows.innerHTML = images.map((v,i)=>`
      <div class="img-row">
        <input data-imgidx="${i}" value="${esc(v)}" placeholder="لینک عکس شماره ${i+1}">
        <button type="button" data-rmimg="${i}"><i class="fa-solid fa-xmark"></i></button>
      </div>`).join('');
    imgRows.querySelectorAll('[data-imgidx]').forEach(inp=>{
      inp.addEventListener('input', e=>{ images[+e.target.dataset.imgidx]=e.target.value; });
    });
    imgRows.querySelectorAll('[data-rmimg]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ images.splice(+btn.dataset.rmimg,1); if(!images.length) images.push(''); renderImgRows(); });
    });
  }
  renderImgRows();
  document.getElementById('addImgRow').addEventListener('click', ()=>{ images.push(''); renderImgRows(); });

  document.getElementById('fProvinceF').addEventListener('change', e=>{ document.getElementById('fCityF').innerHTML=cityOptions(e.target.value,''); });
  document.querySelectorAll('input[name=fListingType]').forEach(r=>{
    r.addEventListener('change', e=>{ document.getElementById('priceLabel').textContent = e.target.value==='sale'? 'قیمت فروش (تومان)' : 'قیمت اجاره (تومان)'; });
  });
  if(existing && existing.listingType==='sale') document.getElementById('priceLabel').textContent='قیمت فروش (تومان)';
  document.getElementById('fHasDiscount').addEventListener('change', e=>{
    document.getElementById('discountRow').style.display = e.target.checked? 'block':'none';
    if(!e.target.checked) document.getElementById('fOriginalPrice').value='';
  });
  const modelingCb = document.getElementById('fWantsModeling');
  if(modelingCb) modelingCb.addEventListener('change', e=>{ document.getElementById('modelingNote').style.display = e.target.checked? 'block':'none'; });

  document.getElementById('submitForm').addEventListener('click', async ()=>{
    if(!apiReady()){ toast('ابتدا آدرس سرور (Worker) را در تنظیمات مدیریت وارد کنید'); return; }
    const ownerName=document.getElementById('ownerName').value.trim();
    const ownerPhone=document.getElementById('ownerPhone').value.trim();
    const title=document.getElementById('fTitle').value.trim();
    const province=document.getElementById('fProvinceF').value;
    if(!ownerName||!ownerPhone){ toast('لطفاً نام و شماره تماس خودتان را وارد کنید'); return; }
    if(!title||!province){ toast('لطفاً عنوان و استان را وارد کنید'); return; }

    const payload = {
      title, listingType: document.querySelector('input[name=fListingType]:checked').value,
      category:document.getElementById('fCat').value,
      province, city:document.getElementById('fCityF').value,
      size:document.getElementById('fSize').value.trim(),
      price: document.getElementById('fPrice').value? Number(document.getElementById('fPrice').value) : null,
      description: document.getElementById('fDesc').value.trim(),
      images: images.filter(Boolean),
      videoUrl: document.getElementById('fVid').value.trim(),
      wantsModeling: document.getElementById('fWantsModeling')? document.getElementById('fWantsModeling').checked : false,
      originalPrice: document.getElementById('fHasDiscount').checked && document.getElementById('fOriginalPrice').value? Number(document.getElementById('fOriginalPrice').value) : null,
    };

    const btn=document.getElementById('submitForm');
    btn.disabled=true; btn.innerHTML='<span class="spinner"></span> در حال ثبت...';

    saveOwner({name:ownerName, phone:ownerPhone});
    MY_OWNER={name:ownerName, phone:ownerPhone};

    try{
      if(editing){
        await apiFetch(`/api/listings/${existing.id}`, { method:'PUT', admin:true, body:payload });
        await refreshData(false);
        toast('آگهی ویرایش شد'); go('#/item/'+existing.id);
      } else {
        const res = await apiFetch('/api/listings', { method:'POST', body:{ ownerName, ownerPhone, item:payload } });
        await refreshData(false); renderTicker();
        toast(res.imagesTrimmed? 'آگهی ثبت شد؛ فقط ۵ عکس اول رایگان بودند و بقیه حذف شدند — پس از بررسی مدیر منتشر می‌شود' : 'آگهی شما ثبت شد؛ حداکثر تا ۲ ساعت دیگر پس از بررسی منتشر می‌شود ✅');
        go('#/item/'+res.item.id);
      }
    }catch(e){
      if(e.status===403 && e.data && e.data.error==='license_required'){
        toast(e.data.message || 'برای ثبت آگهی نیاز به لایسنس دارید');
      } else {
        toast('ثبت ناموفق بود: '+e.message);
      }
      btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-check"></i> ثبت آگهی';
    }
  });

/* ==========================================================
   پنل مدیریت
   ========================================================== */
function renderAdmin(tab){
  const app=document.getElementById('app');
  if(!isAdminLoggedIn()){
    app.innerHTML=`
      <div class="admin-login form-card">
        <h2><i class="fa-solid fa-user-shield"></i> ورود مدیر</h2>
        ${!apiReady() ? `<div class="hint-box">آدرس Worker را وارد کنید:
          <div class="field" style="margin-top:8px;"><input id="quickWorkerUrl" placeholder="https://your-worker.workers.dev"></div>
          <button class="btn small" id="quickSaveWorker">ذخیره آدرس</button>
        </div>` : ''}
        <div class="field"><label>رمز عبور</label><input id="adminPass" type="password" placeholder="رمز عبور را وارد کنید"></div>
        <button class="btn" id="adminLoginBtn"><i class="fa-solid fa-right-to-bracket"></i> ورود</button>
        <p style="font-size:11px;color:var(--ink-soft);margin-top:10px;">رمز پیش‌فرض: <b>1234</b></p>
      </div>`;
    const qs=document.getElementById('quickSaveWorker');
    if(qs) qs.addEventListener('click', async ()=>{
      CONFIG.workerUrl=document.getElementById('quickWorkerUrl').value.trim().replace(/\/$/,'');
      saveConfig(CONFIG); await refreshData(true); renderTicker(); renderAdmin('dashboard');
    });
    document.getElementById('adminLoginBtn').addEventListener('click', async ()=>{
      if(!apiReady()){ toast('ابتدا آدرس Worker را وارد کنید'); return; }
      const pass=document.getElementById('adminPass').value;
      const btn=document.getElementById('adminLoginBtn');
      btn.disabled=true; btn.innerHTML='<span class="spinner"></span> در حال ورود...';
      try{
        const res=await apiFetch('/api/admin/login', { method:'POST', body:{ password: pass } });
        SESSION={ token:res.token, expiresAt:res.expiresAt }; saveSession(SESSION);
        go('#/admin/dashboard'); renderAdmin('dashboard');
      }catch(e){
        if(e.status===401) toast('رمز عبور اشتباه است');
        else if(e.status) toast('خطا از سمت سرور: '+e.message);
        else toast('اتصال به سرور برقرار نشد');
        btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-right-to-bracket"></i> ورود';
      }
    });
    return;
  }

  const tabs=[
    ['dashboard','آگهی‌ها','fa-list'],
    ['stats','آمار بازدید','fa-chart-line'],
    ['licenses','لایسنس‌ها','fa-id-card'],
    ['ads','تبلیغات، تماس و پیام‌ها','fa-bullhorn'],
    ['categories','انواع لباس','fa-tags'],
    ['locations','شهرها','fa-map-location-dot'],
    ['backup','پشتیبان‌گیری','fa-database'],
    ['settings','تنظیمات','fa-gear'],
  ];
  app.innerHTML=`
    <div class="section-title"><h2><i class="fa-solid fa-user-shield"></i> پنل مدیریت</h2>
      <button class="btn small outline" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> خروج</button></div>
    <div class="admin-tabs">${tabs.map(t=>`<button data-tab="${t[0]}" class="${tab===t[0]?'active':''}"><i class="fa-solid ${t[2]}"></i> ${t[1]}</button>`).join('')}</div>
    <div id="adminBody"></div>
  `;
  document.getElementById('logoutBtn').addEventListener('click', ()=>{ SESSION=null; clearSession(); go('#/admin'); });
  app.querySelectorAll('.admin-tabs button').forEach(b=>{ b.addEventListener('click', ()=>{ go('#/admin/'+b.dataset.tab); renderAdmin(b.dataset.tab); }); });

  const body=document.getElementById('adminBody');
  if(tab==='dashboard') return renderAdminDashboard(body);
  if(tab==='stats') return renderAdminStats(body);
  if(tab==='licenses') return renderAdminLicenses(body);
  if(tab==='ads') return renderAdminAds(body);
  if(tab==='categories') return renderAdminCategories(body);
  if(tab==='locations') return renderAdminLocations(body);
  if(tab==='backup') return renderAdminBackup(body);
  if(tab==='settings') return renderAdminSettings(body);
}
function handleAuthError(e){
  if(e && e.status===401){ toast('نشست مدیریت منقضی شده — دوباره وارد شوید'); SESSION=null; clearSession(); go('#/admin'); return true; }
  return false;
}

function renderAdminStats(body){
  const stats = DB.stats || {totalViews:0, dailyViews:{}};
  const today = new Date().toISOString().slice(0,10);
  const todayViews = stats.dailyViews[today] || 0;

  const last7 = [];
  for(let i=6;i>=0;i--){
    const d = new Date(Date.now() - i*86400000);
    const key = d.toISOString().slice(0,10);
    last7.push([key, stats.dailyViews[key]||0]);
  }
  const maxDay = Math.max(1, ...last7.map(x=>x[1]));

  const topListings = DB.listings.slice().sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,10);

  body.innerHTML=`
    <div class="detail-facts" style="grid-template-columns:1fr 1fr;margin-bottom:14px;">
      <div class="fact"><span>کل بازدید سایت</span><b style="font-size:20px;">${fmtPrice(stats.totalViews)}</b></div>
      <div class="fact"><span>بازدید امروز</span><b style="font-size:20px;">${fmtPrice(todayViews)}</b></div>
    </div>
    <div class="settings-block">
      <h4><i class="fa-solid fa-chart-column"></i> بازدید ۷ روز اخیر</h4>
      ${last7.map(([d,v])=>`
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
          <span style="font-size:11px;color:var(--ink-soft);width:70px;flex-shrink:0;">${fmtDate(new Date(d).getTime())}</span>
          <div style="flex:1;background:var(--p-100);border-radius:6px;overflow:hidden;height:16px;">
            <div style="background:var(--p-600);height:100%;width:${(v/maxDay*100).toFixed(0)}%;"></div>
          </div>
          <b style="font-size:12px;width:24px;text-align:left;">${v}</b>
        </div>`).join('')}
    </div>
    <div class="settings-block">
      <h4><i class="fa-solid fa-eye"></i> پربازدیدترین آگهی‌ها</h4>
      ${topListings.length? topListings.map(it=>`
        <div class="admin-row">
          <div class="info"><b>${esc(it.title)}</b><span>${it.listingType==='sale'?'فروش':'اجاره'} · ${esc(it.ownerName||'')}</span></div>
          <div class="acts"><span class="chip"><i class="fa-solid fa-eye"></i> ${it.views||0}</span></div>
        </div>`).join('') : `<div class="empty-state"><i class="fa-solid fa-eye"></i>هنوز بازدیدی ثبت نشده</div>`}
    </div>
  `;
}

  body.querySelectorAll('[data-delmsg]').forEach(b=>b.addEventListener('click', async ()=>{

    try{ await apiFetch(`/api/ad-requests/${b.dataset.delmsg}`, { method:'DELETE', admin:true }); await refreshData(false); toast('حذف شد'); renderAdminAds(body); }
    catch(e){ if(!handleAuthError(e)) toast('خطا: '+e.message); }
  }));
}

function renderAdminCategories(body){
  body.innerHTML=`
    <div class="settings-block">
      <h4><i class="fa-solid fa-shirt"></i> انواع لباس</h4>
      <div class="tag-list" id="catTags"></div>
      <div class="field" style="margin-top:10px;"><input id="newCat" placeholder="نوع جدید..."></div>
      <button class="btn small" id="addCat"><i class="fa-solid fa-plus"></i> افزودن</button>
    </div>
  `;
  function renderTags(){
    document.getElementById('catTags').innerHTML=DB.categories.rentalTypes.map((t,i)=>`<span class="tag-pill">${esc(t)} <i class="fa-solid fa-xmark" data-rmcat="${i}"></i></span>`).join('');
    document.querySelectorAll('[data-rmcat]').forEach(el=>el.addEventListener('click', async ()=>{
      const list=DB.categories.rentalTypes.slice(); list.splice(+el.dataset.rmcat,1);
      try{ await apiFetch('/api/settings', { method:'PUT', admin:true, body:{categories:{rentalTypes:list}} }); await refreshData(false); toast('ذخیره شد'); renderTags(); }
      catch(e){ if(!handleAuthError(e)) toast('خطا: '+e.message); }
    }));
  }
  renderTags();
  document.getElementById('addCat').addEventListener('click', async ()=>{
    const v=document.getElementById('newCat').value.trim(); if(!v) return;
    const list=DB.categories.rentalTypes.concat([v]);
    try{ await apiFetch('/api/settings', { method:'PUT', admin:true, body:{categories:{rentalTypes:list}} }); await refreshData(false); document.getElementById('newCat').value=''; toast('افزوده شد'); renderTags(); }
    catch(e){ if(!handleAuthError(e)) toast('خطا: '+e.message); }
  });
}

function renderAdminLocations(body){
  body.innerHTML=`
    <div class="field"><input id="newProvince" placeholder="نام استان جدید..."></div>
    <button class="btn small" id="addProvince" style="margin-bottom:14px;"><i class="fa-solid fa-plus"></i> افزودن استان</button>
    <div id="provList"></div>
  `;
  async function saveLocations(provinces){
    try{ await apiFetch('/api/settings', { method:'PUT', admin:true, body:{locations:{provinces}} }); await refreshData(false); toast('ذخیره شد'); }
    catch(e){ if(!handleAuthError(e)) toast('خطا: '+e.message); }
  }
  function renderProvinces(){
    document.getElementById('provList').innerHTML=DB.locations.provinces.map((p,pi)=>`
      <div class="province-block">
        <h4>${esc(p.name)} <i class="fa-solid fa-trash" style="color:var(--danger);float:left;cursor:pointer" data-rmprov="${pi}"></i></h4>
        <div class="city-tags">${p.cities.map((c,ci)=>`<span class="tag-pill">${esc(c)} <i class="fa-solid fa-xmark" data-rmcity="${pi}:${ci}"></i></span>`).join('')}</div>
        <div class="field" style="margin-top:8px;display:flex;gap:6px;">
          <input placeholder="شهرستان جدید..." data-cityinput="${pi}" style="flex:1;">
          <button class="btn small" data-addcity="${pi}">افزودن</button>
        </div>
      </div>`).join('');
    document.querySelectorAll('[data-rmprov]').forEach(el=>el.addEventListener('click', async ()=>{
      if(!confirm('این استان حذف شود؟')) return;
      const provinces=DB.locations.provinces.slice(); provinces.splice(+el.dataset.rmprov,1);
      await saveLocations(provinces); renderProvinces();
    }));
    document.querySelectorAll('[data-rmcity]').forEach(el=>el.addEventListener('click', async ()=>{
      const [pi,ci]=el.dataset.rmcity.split(':').map(Number);
      const provinces=JSON.parse(JSON.stringify(DB.locations.provinces)); provinces[pi].cities.splice(ci,1);
      await saveLocations(provinces); renderProvinces();
    }));
    document.querySelectorAll('[data-addcity]').forEach(el=>el.addEventListener('click', async ()=>{
      const pi=+el.dataset.addcity; const input=document.querySelector(`[data-cityinput="${pi}"]`); const v=input.value.trim(); if(!v) return;
      const provinces=JSON.parse(JSON.stringify(DB.locations.provinces)); provinces[pi].cities.push(v);
      await saveLocations(provinces); renderProvinces();
    }));
  }
  renderProvinces();
  document.getElementById('addProvince').addEventListener('click', async ()=>{
    const v=document.getElementById('newProvince').value.trim(); if(!v) return;
    const provinces=DB.locations.provinces.concat([{name:v,cities:[]}]);
    await saveLocations(provinces); document.getElementById('newProvince').value=''; renderProvinces();
  });
}

function renderAdminBackup(body){
  body.innerHTML=`
    <div class="settings-block"><h4><i class="fa-solid fa-download"></i> دریافت نسخه پشتیبان</h4>
      <button class="btn small" id="doBackup"><i class="fa-solid fa-download"></i> دانلود بکاپ</button></div>
    <div class="settings-block"><h4><i class="fa-solid fa-upload"></i> بازگردانی از فایل</h4>
      <p style="font-size:12px;color:var(--ink-soft)">توجه: اطلاعات فعلی روی سرور جایگزین می‌شود.</p>
      <input type="file" id="restoreFile" accept="application/json">
      <button class="btn small warn" id="doRestore" style="margin-top:8px;"><i class="fa-solid fa-rotate-left"></i> بازگردانی</button></div>
    <div class="settings-block"><h4><i class="fa-solid fa-arrows-rotate"></i> همگام‌سازی</h4>
      <button class="btn small outline" id="forceSync"><i class="fa-solid fa-cloud-arrow-down"></i> دریافت آخرین نسخه از سرور</button></div>
  `;
  document.getElementById('doBackup').addEventListener('click', ()=>{
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download='rental-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); URL.revokeObjectURL(url);
  });
  document.getElementById('doRestore').addEventListener('click', ()=>{
    const f=document.getElementById('restoreFile').files[0]; if(!f){ toast('فایلی انتخاب نشده'); return; }
    if(!confirm('اطلاعات فعلی روی سرور جایگزین می‌شود. ادامه می‌دهید؟')) return;
    const reader=new FileReader();
    reader.onload=async(e)=>{
      try{ const data=JSON.parse(e.target.result); await apiFetch('/api/restore', { method:'POST', admin:true, body:data }); await refreshData(false); toast('بازگردانی انجام شد'); renderAdmin('backup'); }
      catch(err){ if(!handleAuthError(err)) toast('ناموفق: '+err.message); }
    };
    reader.readAsText(f);
  });
  document.getElementById('forceSync').addEventListener('click', async ()=>{ await refreshData(true); renderTicker(); renderAdmin('backup'); });
}

function renderAdminSettings(body){
  const policy=DB.settings.licensePolicy;
  const mg=DB.settings.mediaGuide||{text:'',url:''};
  const modeling=DB.settings.modeling||{enabled:true,price:200000,note:''};
  body.innerHTML=`
    <div class="settings-block">
      <h4><i class="fa-solid fa-server"></i> آدرس سرور (Cloudflare Worker)</h4>
      <div class="field"><label>Worker URL</label><input id="cfgWorkerUrl" value="${esc(CONFIG.workerUrl||'')}" placeholder="https://your-worker.workers.dev"></div>
      <button class="btn small" id="saveCfg"><i class="fa-solid fa-check"></i> ذخیره و اتصال</button>
    </div>
    <div class="settings-block">
      <h4><i class="fa-solid fa-id-card-clip"></i> سیاست لایسنس</h4>
      <div class="toggle-row">

      </div>
      <div class="field" style="margin-top:10px;"><label>تعداد عکس رایگان</label><input id="polLimit" type="number" value="${policy.freeImageLimit}"></div>
      <button class="btn small" id="savePolicy"><i class="fa-solid fa-check"></i> ذخیره سیاست لایسنس</button>
    </div>
    <div class="settings-block">
      <h4><i class="fa-solid fa-image"></i> راهنمای آپلود عکس/فیلم</h4>
      <p style="font-size:12px;color:var(--ink-soft);margin-top:0;">این متن و لینک، کنار فیلدهای عکس/فیلم در فرم ثبت آگهی نمایش داده می‌شود.</p>
      <div class="field"><label>متن راهنما</label><input id="mgText" value="${esc(mg.text)}" placeholder="مثلاً: عکس‌هاتون رو اینجا آپلود کنید و لینکشو بگیرید:"></div>
      <div class="field"><label>لینک سایت آپلود</label><input id="mgUrl" value="${esc(mg.url)}" placeholder="https://..."></div>
      <button class="btn small" id="saveMediaGuide"><i class="fa-solid fa-check"></i> ذخیره راهنما</button>
    </div>
    <div class="settings-block">
      <h4><i class="fa-solid fa-camera-retro"></i> گزینهٔ مدلینگ</h4>
      <div class="toggle-row">
        <span>نمایش گزینهٔ «درخواست مدلینگ» در فرم ثبت آگهی</span>
        <label class="switch"><input type="checkbox" id="modEnabled" ${modeling.enabled?'checked':''}><span class="slider"></span></label>
      </div>
      <div class="field" style="margin-top:10px;"><label>هزینه (تومان)</label><input id="modPrice" type="number" value="${modeling.price}"></div>
      <div class="field"><label>توضیح تکمیلی</label><textarea id="modNote">${esc(modeling.note)}</textarea></div>
      <button class="btn small" id="saveModeling"><i class="fa-solid fa-check"></i> ذخیره تنظیمات مدلینگ</button>
    </div>
    <div class="settings-block">
      <h4><i class="fa-solid fa-key"></i> تغییر رمز مدیریت</h4>
      <div class="field"><label>رمز جدید</label><input id="newPass" type="password" placeholder="رمز عبور جدید"></div>
      <button class="btn small warn" id="savePass"><i class="fa-solid fa-key"></i> تغییر رمز</button>
    </div>
    <div class="settings-block">
      <h4><i class="fa-solid fa-store"></i> نام سایت</h4>
      <div class="field"><input id="siteName" value="${esc(DB.settings.siteName)}"></div>
      <button class="btn small" id="saveSiteName"><i class="fa-solid fa-check"></i> ذخیره</button>
    </div>
  `;
  document.getElementById('saveMediaGuide').addEventListener('click', async ()=>{
    try{
      const mediaGuide={ text:document.getElementById('mgText').value.trim(), url:document.getElementById('mgUrl').value.trim() };
      await apiFetch('/api/settings', { method:'PUT', admin:true, body:{mediaGuide} }); await refreshData(false); toast('راهنما ذخیره شد');
    }catch(e){ if(!handleAuthError(e)) toast('خطا: '+e.message); }
  });
  document.getElementById('saveModeling').addEventListener('click', async ()=>{
    try{
      const modelingBody={ enabled:document.getElementById('modEnabled').checked, price:Number(document.getElementById('modPrice').value)||0, note:document.getElementById('modNote').value.trim() };
      await apiFetch('/api/settings', { method:'PUT', admin:true, body:{modeling:modelingBody} }); await refreshData(false); toast('تنظیمات مدلینگ ذخیره شد');
    }catch(e){ if(!handleAuthError(e)) toast('خطا: '+e.message); }

  document.getElementById('saveCfg').addEventListener('click', async ()=>{
    CONFIG.workerUrl=document.getElementById('cfgWorkerUrl').value.trim().replace(/\/$/,'');

  });

      const licensePolicy={ requireForPosting:document.getElementById('polPosting').checked, requireForExtraImages:document.getElementById('polImages').checked, freeImageLimit:Number(document.getElementById('polLimit').value)||5 };

    catch(e){ if(!handleAuthError(e)) toast('خطا: '+e.message); }
  });
  document.getElementById('saveSiteName').addEventListener('click', async ()=>{
    try{ await apiFetch('/api/settings', { method:'PUT', admin:true, body:{siteName:document.getElementById('siteName').value.trim()} }); await refreshData(false); toast('ذخیره شد'); }
    catch(e){ if(!handleAuthError(e)) toast('خطا: '+e.message); }
  });
}

async function boot(){
  loadLocalCache();
  setConn(apiReady()?'syncing':'offline');
  await refreshData(false);
  renderTicker();
  renderRoute();
  if(apiReady() && !location.hash.startsWith('#/admin')){
    apiFetch('/api/stats/view', { method:'POST' }).catch(()=>{});
  }
  setInterval(async ()=>{
    if(apiReady()){
      await refreshData(false); renderTicker();
      if(!location.hash.startsWith('#/add') && !location.hash.startsWith('#/edit')) renderRoute();
    }
  }, 45000);
}
boot();
</script>
